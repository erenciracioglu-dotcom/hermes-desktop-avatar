[project]
name = "hermes-desktop-avatar"
version = "0.1.0"
description = "Always-on-top desktop avatar UI shell for a local Hermes Agent gateway"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6.0,<6.9",
  "requests>=2.31.0",
  "opencv-python>=4.9.0",
  "numpy>=1.26.0",
  "edge-tts>=6.1.0",
  "Pillow>=10.0.0",
]

[project.scripts]
hermes-desktop-avatar = "avatar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
